name: Test macOS

on:
  workflow_dispatch

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Run command
        run: |
          system_profiler SPHardwareDataType
          sw_vers
          sysctl -n hw.model
          echo "machine info:"
          printf "Manufacturer: Apple\nModel: %s\nSerial Number: %s\n" \
          "$(sysctl -n hw.model)" \
          "$(ioreg -l | awk -F'"' '/IOPlatformSerialNumber/ {print $(NF-1)}')"
          echo "monitor info:"
          system_profiler SPDisplaysDataType
          echo "monitor info brief:"
          system_profiler SPDisplaysDataType | grep -E "Vendor:|Display Type:|Serial Number:"
